services:

  postgres:
    image: postgres:17
    container_name: cashflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cashflow
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow

    ports:
      - "5432:5432"

    volumes:
      - cashflow-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    networks:
      - cashflow-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cashflow-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cashflow.dev
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - cashflow-pgadmin-data:/var/lib/pgadmin

    networks:
      - cashflow-network


networks:
  cashflow-network:
    name: cashflow-network
    driver: bridge


volumes:
  cashflow-postgres-data:
    name: cashflow-postgres-data

  cashflow-pgadmin-data:
    name: cashflow-pgadmin-data